# Stremio Music – example compose file.
# Joins the existing media-stack network so the app can reach navidrome:4533 and qbittorrent:8080.
services:
  stremio-music:
    build:
      context: .
      args:
        REVISION: ${REVISION:-unknown}
    # a local build by default; set STREMIO_MUSIC_IMAGE in .env to run an image from your registry
    image: ${STREMIO_MUSIC_IMAGE:-stremio-music:local}
    container_name: stremio-music
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-Australia/Melbourne}
      # cap for the streaming engine's torrent cache (e.g. 20GB, 512MiB, 0 = no cache, unlimited)
      ENGINE_CACHE_SIZE: ${ENGINE_CACHE_SIZE:-10GB}
      # behind a reverse proxy: its address(es), e.g. the shared Docker network (see README)
      # TRUSTED_PROXIES: 172.18.0.0/16
      # MusicBrainz lookups for merging artists across sources: your contact (email or URL), as
      # MusicBrainz requires; leave unset to match by the sources' own MBIDs and names only
      # MUSICBRAINZ_CONTACT: you@example.org
      # first admin without the setup code (ignored once an account exists)
      # ADMIN_USERNAME: admin
      # ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    ports:
      - "8095:8095"
    volumes:
      - ./config:/config                       # settings, plugins, database
      - ./cache:/cache                         # engine/torrent cache
      - /srv/media/library/music:/music        # library, shared read-write with Navidrome
      - ./downloads:/downloads                 # optional staging area
    networks:
      - media
    # the app stops the engine and exits within a few seconds; this is only a safety margin
    stop_grace_period: 20s

networks:
  media:
    name: media-stack_default
    external: true
